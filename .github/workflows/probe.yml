# Temporary: downloads one uploaded mesh pack from Roblox and prints how Roblox imported it.
name: Probe mesh import
on:
  push:
    branches: [claude/project-thread-4c39kw]
    paths: [.github/workflows/probe.yml, tools/probe/**]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Lune
        run: |
          curl -sSL -o lune.zip https://github.com/lune-org/lune/releases/download/v0.10.4/lune-0.10.4-linux-x86_64.zip
          unzip -q lune.zip -d "$HOME/lune" && echo "$HOME/lune" >> "$GITHUB_PATH"
      - name: Download packs
        env:
          API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: |
          for id in 114462700039011 139735021399210; do
            echo "== asset $id"
            code=$(curl -s -o meta.json -w '%{http_code}' -H "x-api-key: $API_KEY" "https://apis.roblox.com/asset-delivery-api/v1/assetId/$id")
            echo "asset-delivery: $code $(head -c 300 meta.json)"
            loc=$(jq -r '.location // empty' meta.json 2>/dev/null || true)
            if [ -n "$loc" ]; then
              curl -sSL -o "pack-$id.rbxm" "$loc"
              file "pack-$id.rbxm"; ls -la "pack-$id.rbxm"
              lune run tools/probe/dump.luau "pack-$id.rbxm" || true
            fi
          done
