# Manual check of what Roblox says about uploaded pictures (tools/check/assets.mjs).
name: Check uploaded pictures

on:
  workflow_dispatch:
    inputs:
      filter:
        description: Only assets whose name contains this
        required: false
        default: ''

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node tools/check/assets.mjs "${{ inputs.filter }}"
        env:
          API_KEY: ${{ secrets.ROBLOX_API_KEY }}
      - name: Look up the images inside the uploaded decals
        run: node tools/models/resolve-images.mjs && cat tools/models/images.json | head -40
        env:
          API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          UNIVERSE: ${{ vars.ROBLOX_UNIVERSE_ID || '10771588518' }}
          PLACE: ${{ vars.ROBLOX_PLACE_ID || '82604390904451' }}
