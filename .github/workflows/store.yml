# Shows what the Roblox game page has for its icon and thumbnails (tools/store/check.mjs). The
# pictures in store/ are uploaded by hand in the Creator Dashboard; Open Cloud can't set them.
name: Game page pictures

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node tools/store/check.mjs
        env:
          API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          UNIVERSE: ${{ vars.ROBLOX_UNIVERSE_ID || '10771588518' }}
      # The pictures Roblox serves, on their own branch so they can be looked at from anywhere.
      - name: Save the pictures to the game-page-check branch
        run: |
          cd build/game-page
          git init -q -b game-page-check
          git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "What the game page shows"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" game-page-check
