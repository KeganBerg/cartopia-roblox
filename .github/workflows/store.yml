# Puts the game page's icon and thumbnails (store/, made by tools/store/shoot.mjs) on Roblox
# whenever they change on main. Run it by hand with "check only" to see what the page shows now.
name: Game page pictures

on:
  push:
    branches: [main]
    paths: ['store/**', 'tools/store/upload.mjs', '.github/workflows/store.yml']
  workflow_dispatch:
    inputs:
      check:
        description: Only check what the page shows now
        type: boolean
        default: false

concurrency: store

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node tools/store/upload.mjs ${{ inputs.check && '--check' || '' }}
        env:
          API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          UNIVERSE: ${{ vars.ROBLOX_UNIVERSE_ID || '10771588518' }}
