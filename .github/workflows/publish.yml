# Keeps the live Roblox game in step with both repos:
#   - a push to this repo's main branch
#   - a check of the web game every 15 minutes, which publishes only if its game data changed
#   - a manual run from the Actions tab
# Each run converts the web game's src/game code to Luau (tools/transpile), re-records the golden
# data the tests compare against, runs the tests, builds the place with Rojo
# and publishes it with Roblox Open Cloud. A failing test stops the publish, so the live game never
# gets rules that disagree with the web game.
#
# Needs, under Settings > Secrets and variables > Actions:
#   secret   ROBLOX_API_KEY      Open Cloud key with universe-places:write on this experience
#   variables ROBLOX_UNIVERSE_ID / ROBLOX_PLACE_ID only to override the ids below
name: Publish to Roblox

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # Until the key is set, runs still regenerate and test but skip the publish.
      CAN_PUBLISH: ${{ secrets.ROBLOX_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Check out the web game
        uses: actions/checkout@v5
        with:
          repository: KeganBerg/Cartopia
          path: web

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Convert the web game to Luau and record golden data from it
        run: |
          npm ci --prefix web
          npm ci --prefix tools/transpile
          node tools/transpile/transpile.mjs web
          node tools/gen-golden.mjs web
          node tools/gen-store-golden.mjs web

      - name: Install Luau 0.700 (newer releases flag type errors in the port)
        run: |
          curl -sSL -o luau.zip https://github.com/luau-lang/luau/releases/download/0.700/luau-ubuntu.zip
          unzip -q luau.zip -d "$HOME/luau" && rm luau.zip
          echo "$HOME/luau" >> "$GITHUB_PATH"

      - name: See whether the web game changed
        id: diff
        run: |
          git add src/shared/Game src/shared/RaceFloors.luau tests/Golden.luau tests/StoreGolden.luau
          if git diff --cached --quiet; then echo changed=false >> "$GITHUB_OUTPUT"; else echo changed=true >> "$GITHUB_OUTPUT"; fi
          # A scheduled check with nothing new has nothing to publish.
          if [ "${{ github.event_name }}" = schedule ] && git diff --cached --quiet; then echo "CAN_PUBLISH=false" >> "$GITHUB_ENV"; fi

      - name: Test
        if: env.CAN_PUBLISH == 'true' || github.event_name != 'schedule'
        run: |
          luau-analyze src/shared/RaceFloors.luau src/server/Towns.luau
          luau tests/run.luau

      - name: Commit regenerated files
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Convert the latest web game"
          git push

      - uses: CompeyDev/setup-rokit@v0.1.2
        if: env.CAN_PUBLISH == 'true'

      - name: Build the place
        if: env.CAN_PUBLISH == 'true'
        run: rojo build -o Cartopia.rbxl

      - name: Publish with Open Cloud
        if: env.CAN_PUBLISH == 'true'
        env:
          API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          UNIVERSE: ${{ vars.ROBLOX_UNIVERSE_ID || '10771588518' }}
          PLACE: ${{ vars.ROBLOX_PLACE_ID || '82604390904451' }}
        run: |
          curl --fail-with-body -sS -X POST \
            "https://apis.roblox.com/universes/v1/$UNIVERSE/places/$PLACE/versions?versionType=Published" \
            -H "x-api-key: $API_KEY" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @Cartopia.rbxl
