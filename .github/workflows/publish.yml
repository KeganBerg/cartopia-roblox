# Keeps the live Roblox game in step with both repos:
#   - a push to this repo's main branch
#   - a check of the web game every 15 minutes, which publishes only if its game data changed
#   - a manual run from the Actions tab
# Each run converts the web game's src/game code to Luau (tools/transpile) and its 3D models to
# Roblox parts and meshes (tools/models, uploading new meshes), re-records the golden
# data the tests compare against, runs the tests, builds the place with Rojo
# and publishes it with Roblox Open Cloud. A failing test stops the publish, so the live game never
# gets rules that disagree with the web game.
#
# Needs, under Settings > Secrets and variables > Actions:
#   secret   ROBLOX_API_KEY      Open Cloud key with universe-places:write on this experience, and
#                                Assets read and write so the 3D shapes can be uploaded
#   variables ROBLOX_UNIVERSE_ID / ROBLOX_PLACE_ID only to override the ids below
name: Publish to Roblox

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # Until the key is set, runs still regenerate and test but skip the publish.
      CAN_PUBLISH: ${{ secrets.ROBLOX_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Check out the web game
        uses: actions/checkout@v5
        with:
          repository: KeganBerg/Cartopia
          path: web

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Convert the web game to Luau and record golden data from it
        run: |
          npm ci --prefix web
          npm ci --prefix tools/transpile
          node tools/transpile/transpile.mjs web
          node tools/gen-golden.mjs web
          node tools/gen-store-golden.mjs web

      - name: Convert the web game's 3D models (buildings, cars, street pieces)
        run: |
          npm ci --prefix tools/models
          node tools/models/build.mjs web
          # The loading screen's pictures, from the web game's own splash art.
          node tools/splash/build.mjs web

      - name: Upload new 3D shapes to Roblox
        if: env.CAN_PUBLISH == 'true'
        env:
          API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          UNIVERSE: ${{ vars.ROBLOX_UNIVERSE_ID || '10771588518' }}
        run: |
          # Uploads only shapes not in tools/models/assets.json yet, then bakes their ids into Meshes.luau.
          # A key without Assets permission leaves a warning and the game draws boxes in their place.
          node tools/models/upload.mjs
          # The image inside each uploaded picture, where the key can run Luau in the place
          # (otherwise the game's server looks them up itself, see server/Pictures).
          PLACE="${{ vars.ROBLOX_PLACE_ID || '82604390904451' }}" node tools/models/resolve-images.mjs
          node tools/models/build.mjs --json build/models.json
          node tools/splash/build.mjs web

      - name: Install Luau 0.700 (newer releases flag type errors in the port)
        run: |
          curl -sSL -o luau.zip https://github.com/luau-lang/luau/releases/download/0.700/luau-ubuntu.zip
          unzip -q luau.zip -d "$HOME/luau" && rm luau.zip
          echo "$HOME/luau" >> "$GITHUB_PATH"

      - name: See whether the web game changed
        id: diff
        run: |
          git add src/shared/Game src/shared/RaceFloors.luau src/shared/Models src/first/SplashImages.luau tests/Golden.luau tests/StoreGolden.luau
          if [ -f tools/models/assets.json ]; then git add tools/models/assets.json; fi
          if [ -f tools/models/images.json ]; then git add tools/models/images.json; fi
          if git diff --cached --quiet; then echo changed=false >> "$GITHUB_OUTPUT"; else echo changed=true >> "$GITHUB_OUTPUT"; fi
          # A scheduled check publishes only when something is new: a web game change, or a commit
          # that never made it live (the "published" tag marks the last commit that did).
          git fetch -q origin tag published 2>/dev/null || true
          if [ "${{ github.event_name }}" = schedule ] && git diff --cached --quiet \
            && [ "$(git rev-parse -q --verify published^{commit})" = "$(git rev-parse HEAD)" ]; then
            echo "CAN_PUBLISH=false" >> "$GITHUB_ENV"
          fi

      - name: Test
        if: env.CAN_PUBLISH == 'true' || github.event_name != 'schedule'
        run: |
          luau-analyze src/shared/RaceFloors.luau src/server/Towns.luau
          luau tests/run.luau

      - name: Commit regenerated files
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Convert the latest web game"
          # main may have moved during a long upload; replay this commit on top rather than lose
          # the uploaded shapes' ids.
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep $((i * 5))
          done
          exit 1

      - uses: CompeyDev/setup-rokit@v0.1.2
        if: env.CAN_PUBLISH == 'true'

      - name: Build the place
        if: env.CAN_PUBLISH == 'true'
        run: rojo build -o Cartopia.rbxl

      - name: Publish with Open Cloud
        if: env.CAN_PUBLISH == 'true'
        env:
          API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          UNIVERSE: ${{ vars.ROBLOX_UNIVERSE_ID || '10771588518' }}
          PLACE: ${{ vars.ROBLOX_PLACE_ID || '82604390904451' }}
        run: |
          # Roblox answers 409 "server is busy" now and then, so try a few times before giving up.
          for attempt in 1 2 3 4 5; do
            code=$(curl -sS -o response.txt -w '%{http_code}' -X POST \
              "https://apis.roblox.com/universes/v1/$UNIVERSE/places/$PLACE/versions?versionType=Published" \
              -H "x-api-key: $API_KEY" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @Cartopia.rbxl)
            case "$code" in 409|429|5??) echo "Roblox answered $code, retrying in a minute"; sleep 60 ;; *) break ;; esac
          done
          # Roblox's answer goes in an annotation, so it shows on the run page without opening logs.
          if [ "$code" != 200 ]; then echo "::error title=Roblox refused the publish::HTTP $code $(head -c 500 response.txt)"; exit 1; fi
          echo "::notice title=Published to Roblox::$(cat response.txt)"
          git tag -f published && git push -qf origin published
